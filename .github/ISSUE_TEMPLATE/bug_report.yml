name: Bug report
description: Report something that isn't working in YAGL
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: YAGL version
      placeholder: 0.1.0-rc1
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Please remove personal data from logs and screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
