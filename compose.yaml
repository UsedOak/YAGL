name: yagl
services:
  yagl:
    build: .
    container_name: yagl
    restart: unless-stopped
    ports:
      - "${YAGL_BIND:-0.0.0.0}:${YAGL_PORT:-8080}:8080"
    environment:
      YAGL_DB_PATH: /data/yagl.sqlite3
    volumes:
      - yagl_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  yagl_data:
